<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Browse internship opportunities on Internship Lottery." />
    <title>Job Board · Internship Lottery</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="auth-pending">
    <div class="app-shell">
      <aside class="sidebar">
        <a class="brand" href="index.html" aria-label="Internship Lottery Home">
          <span class="brand-mark">IL</span>
          <span>Internship Lottery</span>
        </a>
        <p class="eyebrow sidebar-label">Workspace</p>
        <nav class="nav" aria-label="Primary navigation">
          <a class="nav-link" href="index.html">Dashboard</a>
          <a class="nav-link" href="applications.html">Applications <b id="nav-application-count">—</b></a>
          <a class="nav-link active" href="jobs.html">Job board <b>new</b></a>
        </nav>
        <div class="sidebar-bottom">
          <div class="profile">
            <span class="avatar" id="profile-avatar">U</span>
            <span><strong id="profile-name">User</strong><small>Job seeker</small></span>
            <button id="profile-menu-toggle" class="profile-menu-toggle" aria-label="Profile menu" aria-expanded="false" aria-controls="profile-menu">•••</button>
            <div id="profile-menu" class="profile-menu" hidden><button id="logout-button" type="button">Log out</button></div>
          </div>
        </div>
      </aside>

      <main class="main-content jobs-page">
        <header class="applications-header">
          <div class="mobile-brand"><span class="brand-mark">IL</span> Internship Lottery</div>
          <a class="text-link" href="index.html">Dashboard</a>
        </header>

        <section class="panel jobs-board-panel">
          <div class="section-heading">
            <div>
              <p class="eyebrow">Job board</p>
              <h1>Find your next opportunity</h1>
            </div>
            <span id="jobs-count" class="applications-count">Loading jobs…</span>
          </div>
          <p id="jobs-message" class="jobs-message" role="status" aria-live="polite"></p>
          <label class="jobs-search" for="job-search">
            <span>Search by job title</span>
            <input id="job-search" type="search" placeholder="e.g. Software Engineer Intern" autocomplete="off" />
          </label>
          <div id="jobs-list" class="jobs-list"></div>
          <div id="jobs-empty" class="empty-state" hidden>No jobs are available yet.</div>
          <nav class="jobs-pagination" aria-label="Job board pages">
            <button id="jobs-previous" class="secondary-button" type="button" disabled>← Previous</button>
            <span id="jobs-page" aria-live="polite">Page 1</span>
            <button id="jobs-next" class="secondary-button" type="button" disabled>Next →</button>
          </nav>
        </section>
      </main>
    </div>

    <script type="module">
      import { createClient } from
        'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';

      const supabase = createClient(
        'https://hemcyspyolpvrlghwozj.supabase.co',
        'sb_publishable_a5L98DxxA6JnipbhI9_9yw_SCjFjGEJ'
      );

      const jobsList = document.querySelector('#jobs-list');
      const jobsCount = document.querySelector('#jobs-count');
      const jobsMessage = document.querySelector('#jobs-message');
      const jobsEmpty = document.querySelector('#jobs-empty');
      const jobSearch = document.querySelector('#job-search');
      const previousButton = document.querySelector('#jobs-previous');
      const nextButton = document.querySelector('#jobs-next');
      const jobsPage = document.querySelector('#jobs-page');
      const pageSize = 50;
      let currentUserId = null;
      let loadedJobs = [];
      let currentPage = 0;
      let totalJobs = 0;
      let searchTimer = null;

      function escapeHtml(value = '') {
        return String(value).replace(/[&<>'"]/g, (character) => ({
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          "'": '&#39;',
          '"': '&quot;'
        }[character]));
      }

      function safeUrl(value = '') {
        try {
          const url = new URL(value);
          return ['http:', 'https:'].includes(url.protocol) ? url.href : '#';
        } catch {
          return '#';
        }
      }

      function formatDate(value) {
        if (!value) return 'Date unavailable';
        const date = new Date(value);
        return Number.isNaN(date.getTime())
          ? 'Date unavailable'
          : new Intl.DateTimeFormat('en-US', { month: 'short', day: 'numeric', year: 'numeric' }).format(date);
      }

      function companyIconUrl(value) {
        try {
          const url = new URL(value);
          if (!['http:', 'https:'].includes(url.protocol)) return null;
          return `https://www.google.com/s2/favicons?domain=${encodeURIComponent(url.hostname)}&sz=64`;
        } catch {
          return null;
        }
      }

      function companyLogo(job, url) {
        const initials = escapeHtml((job.company || '??').slice(0, 2).toUpperCase());
        const iconUrl = companyIconUrl(url);
        if (!iconUrl) return `<span class="job-logo">${initials}</span>`;

        return `<span class="job-logo job-logo-image"><img src="${escapeHtml(iconUrl)}" alt="" loading="lazy" onerror="this.parentElement.classList.remove('job-logo-image');this.parentElement.textContent='${initials}'" /></span>`;
      }

      function renderJobs(jobs) {
        loadedJobs = jobs;
        jobsList.innerHTML = jobs.map((job) => {
          const url = safeUrl(job.application_url);
          const link = url === '#'
            ? '<span class="jobs-card-link unavailable">Link unavailable</span>'
            : `<span class="jobs-card-links"><a class="jobs-card-link" href="${url}" target="_blank" rel="noreferrer">View listing ↗</a><a class="apply-button" href="${url}" target="_blank" rel="noreferrer" data-apply-id="${escapeHtml(job.id)}">Apply ↗</a></span>`;

          return `<article class="job-card database-job-card">
            <div class="job-top">
              ${companyLogo(job, url)}
              <div><h2 class="job-title">${escapeHtml(job.role || 'Untitled role')}</h2><div class="job-company">${escapeHtml(job.company || 'Unknown company')}</div></div>
              <time class="job-date">${formatDate(job.posted_at)}</time>
            </div>
            <div class="job-details"><span>⌖ ${escapeHtml(job.location || 'Unspecified')}</span>${link}</div>
          </article>`;
        }).join('');
        jobsCount.textContent = `${totalJobs} ${totalJobs === 1 ? 'job' : 'jobs'}`;
        jobsEmpty.hidden = jobs.length !== 0;
        jobsPage.textContent = `Page ${currentPage + 1}`;
        previousButton.disabled = currentPage === 0;
        nextButton.disabled = (currentPage + 1) * pageSize >= totalJobs;
      }

      function escapeIlike(value) {
        return value.replace(/[\\%_]/g, (character) => `\\${character}`);
      }

      async function loadJobs() {
        const searchTerm = jobSearch.value.trim();
        const from = currentPage * pageSize;
        const to = from + pageSize - 1;
        let query = supabase
          .from('jobs')
          .select('id, provider, provider_id, company, role, location, application_url, posted_at, is_active', { count: 'exact' })
          .eq('is_active', true)
          .order('posted_at', { ascending: false, nullsFirst: false })
          .range(from, to);

        if (searchTerm) {
          query = query.ilike('role', `%${escapeIlike(searchTerm)}%`);
        }

        jobsMessage.classList.remove('jobs-message-error');
        jobsMessage.textContent = 'Loading jobs…';
        const { data: jobs, error: jobsError, count } = await query;

        if (jobsError) {
          console.error('Jobs query failed:', jobsError);
          jobsCount.textContent = 'Unavailable';
          jobsMessage.textContent = 'Could not load jobs right now.';
          jobsMessage.classList.add('jobs-message-error');
          return;
        }

        totalJobs = count || 0;
        jobsEmpty.textContent = searchTerm
          ? 'No jobs match that title.'
          : 'No jobs are available yet.';
        jobsMessage.textContent = '';
        renderJobs(jobs || []);
      }

      jobSearch.addEventListener('input', () => {
        currentPage = 0;
        clearTimeout(searchTimer);
        searchTimer = setTimeout(loadJobs, 250);
      });

      previousButton.addEventListener('click', () => {
        if (currentPage === 0) return;
        currentPage -= 1;
        loadJobs();
      });

      nextButton.addEventListener('click', () => {
        if ((currentPage + 1) * pageSize >= totalJobs) return;
        currentPage += 1;
        loadJobs();
      });

      function getDisplayName(user) {
        const metadata = user?.user_metadata || {};
        return metadata.username || metadata.full_name || metadata.name || metadata.user_name || user?.email?.split('@')[0] || 'there';
      }

      const { data, error } = await supabase.auth.getSession();
      if (error || !data.session) {
        window.location.replace('login.html');
      } else {
        const displayName = getDisplayName(data.session.user);
        currentUserId = data.session.user.id;
        document.querySelector('#profile-name').textContent = displayName;
        document.querySelector('#profile-avatar').textContent = displayName.split(/\s+/).filter(Boolean).map((part) => part[0]).join('').slice(0, 2).toUpperCase();
        document.body.classList.remove('auth-pending');

        await loadJobs();
      }

      jobsList.addEventListener('click', async (event) => {
        const applyLink = event.target.closest('[data-apply-id]');
        if (!applyLink) return;

        const job = loadedJobs.find((item) => String(item.id) === applyLink.dataset.applyId);
        if (!job) return;

        const application = {
          user_id: currentUserId,
          job_id: job.id,
          is_saved: false,
          status: 'Applied',
          application_date: new Date().toISOString().slice(0, 10),
          company: job.company,
          role: job.role,
          location: job.location,
          application_url: job.application_url
        };

        const { data: existing, error: lookupError } = await supabase
          .from('user_jobs')
          .select('id')
          .eq('user_id', currentUserId)
          .eq('job_id', job.id)
          .maybeSingle();

        if (lookupError) {
          console.error('Tracked job lookup failed:', lookupError);
          jobsMessage.textContent = 'Could not track this application.';
          jobsMessage.classList.add('jobs-message-error');
          return;
        }

        const result = existing
          ? await supabase.from('user_jobs').update(application).eq('id', existing.id).eq('user_id', currentUserId)
          : await supabase.from('user_jobs').insert(application);

        if (result.error) {
          console.error('Tracked job write failed:', result.error);
          jobsMessage.textContent = 'Could not track this application.';
          jobsMessage.classList.add('jobs-message-error');
          return;
        }

        jobsMessage.classList.remove('jobs-message-error');
        jobsMessage.textContent = `${job.company || 'Job'} added to your applications.`;
      });

      const profileMenuToggle = document.querySelector('#profile-menu-toggle');
      const profileMenu = document.querySelector('#profile-menu');
      profileMenuToggle.addEventListener('click', (event) => {
        event.stopPropagation();
        const isOpen = !profileMenu.hidden;
        profileMenu.hidden = isOpen;
        profileMenuToggle.setAttribute('aria-expanded', String(!isOpen));
      });

      document.addEventListener('click', (event) => {
        if (!event.target.closest('#profile-menu') && !event.target.closest('#profile-menu-toggle')) {
          profileMenu.hidden = true;
          profileMenuToggle.setAttribute('aria-expanded', 'false');
        }
      });

      document.querySelector('#logout-button').addEventListener('click', async () => {
        const { error: logoutError } = await supabase.auth.signOut();
        if (!logoutError) window.location.replace('login.html');
      });
    </script>
  </body>
</html>
